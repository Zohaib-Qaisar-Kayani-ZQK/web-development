<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Counter Section -->
    <div class="main-section">
      <h1 class="heading main-heading">Counter</h1>

      <!-- Counter Number to Change  -->
      <h2 class="heading counter-number" id="counter-number-id">00</h2>

      <!-- Buttons Section  -->
      <div class="button-section">
        <button class="btn btn-decrease" id="btn-decrease-id">-</button>
        <button class="btn btn-increase" id="btn-increase-id">+</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
