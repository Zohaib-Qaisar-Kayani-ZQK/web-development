<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Image Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- main heading h1 -->
    <h1>A Diverse Local Collection: Our Image Gallery</h1>
    <h2>Exploring different scenes and captions</h2>

    <div class="image-gallery">
      <!-- image 1: Vertical Rectangle  -->
      <figure>
        <img
          src="gallery-assets/image-1.jpg"
          alt="White conical lighthouse with a bright red lantern room atop a grassy, rocky hill against an overcast sky."
          width="200"
          height="300"
        />
        <!-- The browser expects different file sizes for each breakpoint (e.g., image-1-sm.jpg 400w, image-1-md.jpg 800w). If you only have one single image file, you should omit the srcset attribute entirely. -->
        <figcaption>
          A tall white lighthouse stands watch on a grassy, wind-swept coastal
          ridge under a pale blue sky.
        </figcaption>
      </figure>

      <!-- image 2: Horizontal Rectangle -->
      <figure>
        <img
          src="gallery-assets/image-2.jpg"
          alt="A motorcycle carrying goods drives down a narrow paved village road toward a large, towering volcano emitting a plume of white smoke in East Java, Indonesia."
          width="300"
          height="200"
        />
        <figcaption>
          Daily life unfolds on a quiet village road in East Java, Indonesia,
          under the towering, active peak of Mount Semeru.
        </figcaption>
      </figure>

      <!-- image 3: Square -->
      <figure>
        <img
          src="gallery-assets/image-3.jpg"
          alt="A fallen mossy log stretches over a still, dark stream bordered by vibrant green tree ferns and dense lush foliage in a forest."
          width="300"
          height="300"
        />
        <figcaption>
          A fallen log rests over a calm stream surrounded by lush tree ferns
          and dense forest vegetation.
        </figcaption>
      </figure>

      <!-- image 4: Small Square  -->
      <figure>
        <img
          src="gallery-assets/image-4.jpg"
          alt="Clear water flows over mossy dark boulders scattered with reddish-brown fallen leaves in a forest stream."
          width="100"
          height="100"
        />
        <figcaption>
          Crisp mountain water cascades over moss-covered rocks strewn with
          fallen autumn leaves.
        </figcaption>
      </figure>

      <!-- image 5: Small Horizontal Square  -->
      <figure>
        <img
          src="gallery-assets/image-5.jpg"
          alt="A young wild goat with ridged curved horns peeking out from behind a dark tree trunk against a blurred green forest background."
          width="150"
          height="100"
        />
        <figcaption>
          A wild goat gazes curiously from behind a tree trunk in a lush
          woodland setting.
        </figcaption>
      </figure>

      <!-- image 6: Medium Square  -->
      <figure>
        <img
          src="gallery-assets/image-6.jpg"
          alt="High-angle panoramic view of colourful pastel-painted buildings lining a harbor filled with small boats on the island of Procida, Italy."
          width="200"
          height="200"
        />
        <figcaption>
          Vibrant pastel houses cluster along the marina in Marina Corricella,
          Procida, overlooking calm blue waters filled with fishing boats.
        </figcaption>
      </figure>

      <!-- image 7: Medium Horizontal Rectangle -->
      <figure>
        <img
          src="gallery-assets/image-7.jpg"
          alt="Cars driving down Avenida Corrientes in Buenos Aires, lined with tall buildings, theater signs, and shops under a bright sky."
          width="200"
          height="150"
        />
        <figcaption>
          Cars navigate Avenida Corrientes, the iconic theater and cultural
          avenue in downtown Buenos Aires, Argentina.
        </figcaption>
      </figure>

      <!-- image 8:  Medium Vertical Rectangle  -->
      <figure>
        <img
          src="gallery-assets/image-8.jpg"
          alt="Low-angle view of the massive, waffle-like wooden canopy of Metropol Parasol (Las Setas) over a bustling public square with stairs and pedestrians in Seville, Spain."
          width="150"
          height="200"
          srcset=""
        />
        <figcaption>
          The soaring waffle-patterned timber structure of Metropol Parasol (Las
          Setas de Sevilla) creates shade over La Encarnación square in Seville,
          Spain.
        </figcaption>
      </figure>

      <!-- image 9: Small Vertical Rectangle -->
      <figure>
        <img
          src="gallery-assets/image-9.jpg"
          alt="Tree trunks naturally crisscrossing to form the shape of the letter 'W' amidst dense green forest foliage and ground cover."
          width="100"
          height="150"
        />
        <figcaption>
          Nature creates an optical illusion as interlocking tree trunks
          naturally spell out the letter 'W' in a dense green forest.
        </figcaption>
      </figure>

      <!-- image 10: Small Long Horizontal Rectangle  -->
      <figure>
        <img
          src="gallery-assets/image-10.jpg"
          alt="A calm, glass-like lake reflecting hazy green hills and soft white clouds under a bright blue sky, with a small sandy bank jutting out in the foreground."
          width="200"
          height="100"
        />
        <figcaption>
          Still waters mirror lush, misty hills under a clear blue sky on a
          tranquil morning. Tranquil lake reflection with misty hills.
        </figcaption>
      </figure>
    </div>
    <script src="script.js"></script>
  </body>
</html>
